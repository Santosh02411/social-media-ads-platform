name = "ads-saas-backend"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat" ]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "ads-saas-db"
database_id = "00000000-0000-0000-0000-000000000000" # replace with the id from `wrangler d1 create`
migrations_dir = "../database/migrations"

# KV Storage (SESSIONS holds login sessions + rate-limit counters)
[[kv_namespaces]]
binding = "SESSIONS"
id = "00000000000000000000000000000001"

[[kv_namespaces]]
binding = "TOKENS"
id = "00000000000000000000000000000002"

# R2 Storage
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "ads-saas-media"

# Queues
[[queues.producers]]
binding = "CAMPAIGN_QUEUE"
queue = "campaign-jobs"

[[queues.consumers]]
queue = "campaign-jobs"
max_batch_size = 5
max_batch_timeout = 2
max_retries = 5

# Refresh ad performance numbers every 6 hours
[triggers]
crons = ["0 */6 * * *"]

# ---------------------------------------------------------------------------
# Non-secret settings only. NEVER put secrets here.
#
# Secrets (JWT_SECRET, ENCRYPTION_KEY):
#   local dev  -> backend/.dev.vars   (run `npm run setup:secrets`)
#   production -> `wrangler secret put JWT_SECRET` / `wrangler secret put ENCRYPTION_KEY`
#
# Optional secrets (features switch on when present):
#   ANTHROPIC_API_KEY                                AI ad copy (Claude API)
#   META_APP_ID / META_APP_SECRET                    one-click connect for Facebook + Instagram
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / GOOGLE_ADS_DEVELOPER_TOKEN
#   TIKTOK_APP_ID / TIKTOK_APP_SECRET
#
# For production deploy with the real values, e.g.:
#   wrangler deploy --var ENVIRONMENT:production --var ALLOWED_ORIGINS:https://app.example.com
# ---------------------------------------------------------------------------
[vars]
ENVIRONMENT = "development"
ALLOWED_ORIGINS = "http://localhost:3000,http://127.0.0.1:3000"
FRONTEND_URL = "http://localhost:3000"
# Public URL of THIS API: ad platforms download media from it and OAuth redirects back to it
PUBLIC_API_URL = "http://localhost:8787"
# Session cookie SameSite: "Lax" when the frontend and API share a registrable
# domain (app.example.com + api.example.com); "None" if they are on different sites.
COOKIE_SAMESITE = "Lax"
# Model used for AI ad copy
ANTHROPIC_MODEL = "claude-haiku-5-5"
